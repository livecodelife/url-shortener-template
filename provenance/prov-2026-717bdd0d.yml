id: prov-2026-717bdd0d
title: Identity Service Token Validation
status: open
created_at: "2026-05-15"
author: calebcowen@gmail.com
intent: >
  Token validation is delegated entirely to an external identity service. This service is
  the sole authority on token validity. The API must not implement fallback authentication
  or cache validation results.
constraints:
  - MUST call the identity service synchronously on every authenticated request
  - MUST NOT cache token validation results between requests
  - MUST return 503, not a default authenticated state, when the identity service is unreachable
  - MUST return 401 when the identity service returns an invalid or expired token response
  - Token validation MUST occur before any database read or write on authenticated endpoints
affected_scope:
  - url-shortener/middleware/auth.go
  - url-shortener/auth/identity.go
forbidden_scope: []
