title: GetLink scans nullable types for proxy dummy NULL row compatibility
status: implemented
created_at: "2026-05-15"
author: calebcowen@gmail.com
intent: "GetLink scans into sql.NullString and sql.NullTime instead of string and time.Time directly. The linespec proxy sends a dummy NULL row (not sql.ErrNoRows) for RETURNS EMPTY expectations. Scanning NULL into non-nullable types causes a scan error propagating as 500 instead of 404. Using nullable scan targets and checking slugVal.Valid == false as the not-found condition handles both production ErrNoRows and the proxy dummy NULL row."
